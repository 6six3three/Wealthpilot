name: Build Zenvora 7.3 Native Biometric APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/zm/zenvora/pride/MainActivity.java'
      - 'app/src/main/assets/index.html'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/build.gradle'
      - '.github/workflows/zenvora-7-3-native.yml'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile Zenvora 7.3 with native Android biometric login
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Zenvora-Pride-7-3-Native-Biometric-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
