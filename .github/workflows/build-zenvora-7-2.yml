name: Build Zenvora 7.2 Native Owner Login
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Zenvora_Monster_7_2_Android_Biometric_Source.zip'
      - '.github/workflows/build-zenvora-7-2.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Zenvora 7.2 native project
        shell: bash
        run: |
          set -euo pipefail
          test -s Zenvora_Monster_7_2_Android_Biometric_Source.zip
          mkdir -p "$RUNNER_TEMP/zenvora72"
          unzip -q Zenvora_Monster_7_2_Android_Biometric_Source.zip -d "$RUNNER_TEMP/zenvora72"
          test -f "$RUNNER_TEMP/zenvora72/app/src/main/java/zm/zenvora/pride/MainActivity.java"
          test -f "$RUNNER_TEMP/zenvora72/app/src/main/assets/index.html"
          grep -q "versionCode 10" "$RUNNER_TEMP/zenvora72/app/build.gradle"
          echo "PROJECT_DIR=$RUNNER_TEMP/zenvora72" >> "$GITHUB_ENV"
      - name: Compile Android native biometrics
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Zenvora-Pride-7-2-Biometric-Test-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
