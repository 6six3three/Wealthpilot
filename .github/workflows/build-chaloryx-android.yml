name: Build CHALORYX 3.0 Android APK
on:
  push:
    branches:
      - chaloryx-android-market-lab-2-1
      - chaloryx-market-lab-3-0
    paths:
      - "chaloryx-android/**"
      - ".github/workflows/build-chaloryx-android.yml"
  pull_request:
    paths:
      - "chaloryx-android/**"
      - ".github/workflows/build-chaloryx-android.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile CHALORYX debug APK
        working-directory: chaloryx-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Package installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CHALORYX-Market-Lab-3.0-Android-APK
          path: chaloryx-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
