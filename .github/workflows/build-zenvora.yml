name: Build Zenvora Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-zenvora.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ARCHIVE" ]; then
            echo "::error::No project ZIP found"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/zenvora"
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/zenvora"
          SETTINGS="$(find "$RUNNER_TEMP/zenvora" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::Android project not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zenvora-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
